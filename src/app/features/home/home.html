<div class="home-container">
  <div class="home-heading">
    <h1>Foundry Planner</h1>
    <p>Whiteout Survival — Foundry Battle Coordinator</p>
  </div>

  <div class="role-cards">

    <a class="role-card role-card--admin" routerLink="/login">
      <div class="role-card__icon">
        <mat-icon>shield</mat-icon>
      </div>
      <div class="role-card__label">Admin</div>
      <div class="role-card__sub">Manage tasks and battle plans</div>
    </a>

    <!-- Hardcoded to state 3038: this app is now entered via plannet-wos's state-scoped
         links (see the multi-state rollout plan), but a bare root visit has no :stateId to
         read — 3038 is the only state that existed before that rollout, so it's the correct
         transition-window default here, same as the plan's legacy-link redirects. -->
    <a class="role-card role-card--player" [routerLink]="['3038', 'player']">
      <div class="role-card__icon">
        <mat-icon>person</mat-icon>
      </div>
      <div class="role-card__label">Player</div>
      <div class="role-card__sub">View your assignments and the battle map</div>
    </a>

  </div>
</div>
